# ============================================================
# Secure OpenRouter — docker-compose.yml
# Services:
#   openrouter-proxy  — nginx token proxy       :8081
#   openrouter-mysql  — MySQL 8.0               :3309
#   openrouter-app    — Spring Boot gateway     :8080
#   admin-ui          — React SPA               :3000
#
# Usage:
#   cp .env.example .env   # fill in your values
#   docker compose up -d
# ============================================================

services:

  # ── nginx Reverse Proxy ──────────────────────────────────────
  openrouter-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openrouter-proxy
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8081:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
      - /tmp:uid=101,gid=101
      - /etc/nginx:uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - openrouter-net
    volumes:
      - type: bind
        source: ./logs
        target: /var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── MySQL Database ───────────────────────────────────────────
  openrouter-mysql:
    image: mysql:8.0
    container_name: openrouter-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3309:3306"
    volumes:
      - openrouter-mysql-data:/var/lib/mysql
      # Schema and seed data are now managed by Flyway (app/src/main/resources/db/migration/).
      # The old seed.sql is kept at db/seed.sql for reference but is no longer mounted.
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    networks:
      - openrouter-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Spring Boot Application ──────────────────────────────────
  openrouter-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: openrouter-app
    restart: unless-stopped
    env_file: .env
    environment:
      # Override datasource to use Docker service name instead of localhost
      SPRING_DATASOURCE_URL: jdbc:mysql://openrouter-mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      # Override proxy URL to use Docker service name
      OPENROUTER_PROXY_URL: http://openrouter-proxy:8080
      # AES-GCM master key for encrypting stored OpenRouter API keys
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      openrouter-mysql:
        condition: service_healthy
      openrouter-proxy:
        condition: service_healthy
    networks:
      - openrouter-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── React Admin UI ───────────────────────────────────────────
  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
    container_name: admin-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      openrouter-app:
        condition: service_healthy
    networks:
      - openrouter-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  openrouter-net:
    driver: bridge

volumes:
  openrouter-mysql-data:
