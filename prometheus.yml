# ============================================================
# Prometheus scrape config — AspectOR / Secure OpenRouter Gateway
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'openrouter-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['openrouter-app:8080']
