# ============================================================
# Hardened nginx config — OpenRouter reverse proxy
# Listens on 8080 (non-privileged port, matches non-root user)
# ============================================================

# Run worker processes as the nginx user (set in Dockerfile)
worker_processes auto;
pid /var/run/nginx.pid;

# Suppress version disclosure in error pages and headers
# (set in http block below via server_tokens off)

events {
    worker_connections 512;
}

http {
    # --- Security headers ---
    server_tokens off;                          # Hide nginx version
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;

    # --- Logging ---
    # IMPORTANT: access logs contain paths/query strings.
    # Rotate and restrict: chmod 700 ./logs after first run.
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    # --- Timeouts ---
    client_body_timeout   12s;
    client_header_timeout 12s;
    keepalive_timeout     15s;
    send_timeout          10s;

    # LLM responses can be large; raise if you hit 413 errors
    client_max_body_size  2m;

    # --- Upstream: OpenRouter API ---
    upstream openrouter {
        server openrouter.ai:443;
        keepalive 4;
    }

    server {
        listen 8080;
        server_name localhost;

        # ---- Health check endpoint (no upstream call) ----
        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ---- Proxy all /api/v1/* to OpenRouter ----
        location /api/v1/ {
            proxy_pass          https://openrouter.ai/api/v1/;
            proxy_ssl_server_name on;
            proxy_ssl_verify    on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

            proxy_set_header    Host              openrouter.ai;
            proxy_set_header    Authorization     "Bearer ${OPENROUTER_API_KEY}";
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Support streaming (SSE) responses
            proxy_buffering     off;
            proxy_read_timeout  120s;
            proxy_http_version  1.1;
            proxy_set_header    Connection "";
        }

        # Block everything else
        location / {
            return 404;
        }
    }
}
