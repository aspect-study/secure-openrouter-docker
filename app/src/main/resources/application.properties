# ============================================================
# OpenRouter Gateway — application.properties
# Secrets are injected via environment variables.
# ============================================================

# ── Server ───────────────────────────────────────────────────
server.port=8080
spring.application.name=openrouter-gateway

# ── Virtual Threads (Java 21+ / Spring Boot 3.2+) ────────────
# Uses JVM virtual threads for all Tomcat request handling.
# Ideal for blocking I/O (HTTP client calls to OpenRouter).
spring.threads.virtual.enabled=true

# ── DataSource ───────────────────────────────────────────────
# When running locally: uses localhost:3309
# When running in Docker: SPRING_DATASOURCE_URL env var overrides this (set in docker-compose.yml)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3309}/${MYSQL_DATABASE:openrouter_gateway}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
# validate: Hibernate checks tables/columns exist but does NOT create or alter.
# Schema is fully owned by Flyway — never change this back to update/create.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Dialect is intentionally omitted — Hibernate 6 auto-detects MySQLDialect from the driver.
# Explicitly setting MySQL8Dialect causes a deprecation warning.
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=20
# Disable open-in-view: prevents accidental lazy-load DB queries during response serialization.
spring.jpa.open-in-view=false

# ── Flyway ───────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate=true would be needed only when Flyway is introduced to an
# existing database that already has tables. For a fresh volume (docker compose down -v)
# this must stay false so Flyway runs V1 from scratch.
spring.flyway.baseline-on-migrate=false

# ── JWT ──────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── OpenRouter Proxy ─────────────────────────────────────────
# When running locally: proxy is on localhost:8081
# When running in Docker: proxy is on openrouter-proxy:8080 (internal network)
app.openrouter.proxy-url=${OPENROUTER_PROXY_URL:http://localhost:8081}
# Optional — used by FreeModelSyncService to fetch the models list.
# The public endpoint works without auth, but the key may return a more complete list.
app.openrouter.api-key=${OPENROUTER_API_KEY:}
# Synthesis model for the Orchestrator Hub feature (ReAct agent).
app.openrouter.synthesis-model=${ORCHESTRATOR_SYNTHESIS_MODEL:deepseek/deepseek-r1-0528:free}

# ── Encryption ───────────────────────────────────────────────
# AES-GCM master key for encrypting stored OpenRouter API keys.
# 64-char hex string (32 bytes). Generate: openssl rand -hex 32
encryption.master-key=${ENCRYPTION_MASTER_KEY}

# ── Rate Limiting ────────────────────────────────────────────
app.rate-limit.requests-per-minute=10
app.rate-limit.capacity=10

# ── Actuator ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
# Full latency histogram buckets for http.server.requests — needed for
# histogram_quantile() (p95/p99) in Prometheus/Grafana; default only exposes count/sum/max.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Common "application" tag on every metric — the provisioned JVM (Micrometer)
# dashboard's $application template variable requires this label to exist.
management.metrics.tags.application=${spring.application.name}

# ── Logging ──────────────────────────────────────────────────
logging.level.com.openrouter.gateway=INFO
logging.level.org.springframework.security=WARN
# Suppress Spring Boot's auto-generated security password warning.
# This project uses JWT — no UserDetailsService is registered, so Spring generates
# a fallback in-memory user. The warning is noise; JWT is the actual auth mechanism.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
